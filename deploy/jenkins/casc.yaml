jenkins:
  systemMessage: "Capybaras — ppc-manager CI/CD"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "admin"          # dev only: change for any real use
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
security:
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false
unclassified:
  location:
    url: "http://127.0.0.1:8080/"
jobs:
  # Independent job per repo: a push to one never builds the other.
  - script: |
      pipelineJob('capybaras-ai-provider') {
        description('AI gateway CI/CD — build/test always, deploy with DEPLOY=true or on push to main')
        parameters { booleanParam('DEPLOY', false, 'true = deploy to the VPS on top of CI') }
        // Also in the Jenkinsfile, but that one only lands after a build runs:
        // without this the job is trigger-less from creation until then.
        triggers { scm('H/2 * * * *') }
        definition {
          cpsScm {
            scm {
              git {
                // Same PAT credential as ppc-manager: the token owner needs
                // collaborator access to this repo.
                remote {
                  url('https://github.com/VargasJuan5826/capybaras-ai-provider.git')
                  credentials('github-pat')
                }
                branches('main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }
      }
  - script: |
      pipelineJob('ppc-manager') {
        description('Agency OS CI/CD — build/test always, deploy on push to main or with DEPLOY=true')
        parameters { booleanParam('DEPLOY', false, 'true = deploy to the VPS on top of CI') }
        triggers { scm('H/2 * * * *') }
        definition {
          cpsScm {
            scm {
              git {
                // Clone the app repo from GitHub over HTTPS with the PAT (credential id: github-pat).
                remote {
                  url('https://github.com/Leninead/ppc-manager.git')
                  credentials('github-pat')
                }
                branches('main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }
      }
