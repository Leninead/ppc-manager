# Amazon PPC Manager (Agency OS) — single node, always-on. TLS/WebSocket via a
# separate reverse proxy (see docs/DEPLOY-VPS.md). Self-contained image (seeds the
# skeleton on boot).
#   Local:  docker network create ai-net   (once per host)
#           docker compose up -d --build
#   Deploy: IMAGE_TAG=<sha> docker compose up -d
name: ppc-manager

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ppc-manager:${IMAGE_TAG:-latest}
    container_name: ppc-manager
    init: true
    restart: unless-stopped

    # Loopback only; the reverse proxy reaches it here. No proxy yet → use "8501:8501".
    ports:
      - "127.0.0.1:8501:8501"

    # Every variable the app needs is named here, one by one. Do NOT add
    # `env_file: .env` back: Compose already reads .env to resolve ${...}
    # without handing it to the container, and mounting it injected the whole
    # file — POSTGRES_PASSWORD, PGRST_JWT_SECRET and INTEGRATIONS_WORKER_JWT
    # included. That collapses the trust boundary the sealed-credential design
    # rests on: with the JWT secret an attacker who owns Streamlit can mint a
    # role=integ_worker token and read the very columns the GRANTs withhold.
    environment:
      AGENCY_OS_DATA_DIR: /app/data
      # Filesystem backend (phase 1). Supabase = flip these + SUPABASE_URL/KEY, no rebuild.
      AGENCY_OS_AH_BACKEND: local
      AGENCY_OS_FORECAST_BACKEND: local
      AGENCY_OS_INNOVATION_BACKEND: local
      # Do NOT set AGENCY_OS_LOCAL_MODE in prod — it disables login (app.py:166).
      CLAUDE_PROVIDER_URL: ${CLAUDE_PROVIDER_URL:-http://ai-provider:3111}  # AI gateway, over ai-net
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DATADIVE_API_KEY: ${DATADIVE_API_KEY:-}
      # Portal: web_user JWT (never the worker's), the public half of the
      # sealing key, and the consent redirect the connect dialog builds.
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      INTEGRATIONS_PUBLIC_KEY: ${INTEGRATIONS_PUBLIC_KEY:-}
      INTEGRATIONS_REDIRECT_URI: ${INTEGRATIONS_REDIRECT_URI:-}

    volumes:
      - agency_data:/app/data
      # Must exist before `up` (else Docker creates a dir and login breaks).
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; b=urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=4).read(); sys.exit(0 if b'ok' in b else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks: [ai-net]

networks:
  # Shared with capybaras-ai-provider (no published ports). `docker network create ai-net` once per host.
  ai-net:
    external: true

volumes:
  agency_data:
