# Reverse-proxy overlay: docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d --build
# Only Caddy is published (80/443); it reaches the app by container name over an internal network.
# .env: APP_DOMAIN (app.capybaras.agency; :80 for HTTP-on-IP; app.localhost for local) + ACME_EMAIL
# CD: set COMPOSE_FILE=docker-compose.yml:docker-compose.proxy.yml in .env so a bare `docker compose
# up -d` (what Jenkins runs) uses both files and app stays on Caddy's network (no reparent → no 502).
services:
  app:
    ports: !reset []
    networks: [web]
    # Behind a subdomain proxy Streamlit's WebSocket Origin check 403s the proxied
    # connection ("Connecting..."); disabling it is the documented reverse-proxy config
    # (safe here: proxy is the only public entry, app is behind login). Overlay-only.
    command:
      - streamlit
      - run
      - app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
      - --browser.gatherUsageStats=false
      - --server.enableCORS=false
      - --server.enableXsrfProtection=false

  # Integrations OAuth callback + Mercado Libre webhook receiver.
  # Not published: only Caddy reaches it, on the internal `web` network.
  integrations-receiver:
    build:
      context: .
      dockerfile: services/integrations_receiver/Dockerfile
    # The tag is what makes a deploy land. Without an explicit `image:` the
    # service gets a stable implicit name, compose sees no config change and
    # leaves the old container running even after a rebuild — the receiver
    # COPYs core/integrations/, so that is silent version skew against the app.
    image: ppc-manager-receiver:${IMAGE_TAG:-latest}
    container_name: integrations-receiver
    restart: unless-stopped
    environment:
      # Same PostgREST that the app uses. web_user JWT is enough — the
      # receiver never reads sealed columns.
      SUPABASE_URL: ${SUPABASE_URL:-http://rest-gateway}
      INTEGRATIONS_RECEIVER_JWT: ${INTEGRATIONS_RECEIVER_JWT:?set INTEGRATIONS_RECEIVER_JWT in .env (JWT with role=web_user)}
      # Soft default, and it has to be: you obtain this key by running
      # `worker keys` THROUGH compose, so a `${VAR:?}` here makes the
      # documented install order circular — compose refuses to interpolate
      # the merged file set before the key it is asking for can exist. The
      # receiver checks it at startup instead, so an empty value fails the
      # healthcheck and the deploy's health gate, loudly and in the right place.
      INTEGRATIONS_PUBLIC_KEY: ${INTEGRATIONS_PUBLIC_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8600/health',timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [web]

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-app.localhost}
      ACME_EMAIL: ${ACME_EMAIL:-internal@local}
    volumes:
      - ./deploy/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # persist certs across deploys
      - caddy_config:/config
    networks: [web]
    depends_on: [app, integrations-receiver]

networks:
  web: {}

volumes:
  caddy_data: {}
  caddy_config: {}
