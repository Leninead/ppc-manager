<section class="block" data-module="{{ module_id }}">
  <h2 class="block-section-title">{{ title or module_id }}</h2>
  {% if data.pillars %}
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 0.6rem;">
    {% for pillar in data.pillars %}
    <div style="border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.1rem;">
      <h3 style="margin: 0 0 0.3rem; font-size: 1.05rem;">{{ pillar.name }}</h3>
      <p style="margin: 0; color: var(--text-muted); font-size: 0.9rem;">{{ pillar.tagline | pick_lang(lang) }}</p>
    </div>
    {% endfor %}
  </div>
  {% endif %}
</section>
