{% if data.selected_cases %}
<section class="block" data-module="{{ module_id }}">
  <h2 class="block-section-title">{{ title or module_id }}</h2>
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 0.6rem;">
    {% for case in data.selected_cases %}
    <div style="border: 1px solid var(--border); border-radius: 8px; padding: 1rem;">
      <div class="mono" style="font-size: 0.85rem; color: var(--accent);">{{ case }}</div>
    </div>
    {% endfor %}
  </div>
</section>
{% endif %}
