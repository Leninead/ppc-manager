<section class="block" data-module="{{ module_id }}">
  <h2 class="block-section-title">{{ title or module_id }}</h2>
  <p style="color: var(--text-muted); font-style: italic; margin: 0.5rem 0 0;">
    {% if lang == 'en' %}Section &laquo;{{ title or module_id }}&raquo; — content pending.{% else %}Sección &laquo;{{ title or module_id }}&raquo; — contenido pendiente.{% endif %}
  </p>
</section>
