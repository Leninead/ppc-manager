<section class="block" data-module="{{ module_id }}">
  <h2 class="block-section-title">{{ title or module_id }}</h2>
  {% if data.pillars %}
  <div style="display: flex; flex-direction: column; gap: 1rem; margin-top: 0.6rem;">
    {% for pillar in data.pillars %}
    <div style="border-left: 3px solid var(--accent); padding: 0.4rem 0 0.4rem 1rem;">
      <h3 style="margin: 0 0 0.3rem; font-size: 1.1rem;">{{ pillar.title | pick_lang(lang) }}</h3>
      <p style="margin: 0; color: var(--text-muted); font-size: 0.92rem; line-height: 1.5;">{{ pillar.body | pick_lang(lang) }}</p>
    </div>
    {% endfor %}
  </div>
  {% endif %}
</section>
