# Self-hosted data layer overlay: Postgres + PostgREST ("Supabase flaco") + a /rest/v1
# gateway + pgAdmin. The app talks pure PostgREST, so this is a drop-in for Supabase with
# no app-code change — just point SUPABASE_URL at the gateway and flip the backend flags.
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml -f docker-compose.db.yml up -d
# Nothing here is published publicly except pgAdmin on loopback (reach it via an SSH tunnel).
services:
  app:
    networks: [web]
    environment:
      AGENCY_OS_AH_BACKEND: supabase
      AGENCY_OS_FORECAST_BACKEND: supabase
      AGENCY_OS_INNOVATION_BACKEND: supabase
      SUPABASE_URL: http://rest-gateway
      SUPABASE_KEY: ${SUPABASE_KEY:?set SUPABASE_KEY (a JWT signed with PGRST_JWT_SECRET, role=web_user) in .env}
      INTEGRATIONS_PUBLIC_KEY: ${INTEGRATIONS_PUBLIC_KEY:-}   # solo sella; la privada es del worker
      INTEGRATIONS_REDIRECT_URI: ${INTEGRATIONS_REDIRECT_URI:-}

  db:
    image: postgres:16
    container_name: agency-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agency_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro  # runs once on first init
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agency_os"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [web]

  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: agency-postgrest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/agency_os
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: web_anon                                       # no-token role: no privileges → denied
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?set PGRST_JWT_SECRET in .env}  # verifies the app's Bearer JWT → role=web_user
    depends_on:
      db:
        condition: service_healthy
    networks: [web]

  rest-gateway:
    image: caddy:2
    container_name: agency-rest-gateway
    restart: unless-stopped
    # Publish on loopback so local smoke scripts and the receiver's E2E tests
    # can go through the SAME gateway that production uses, catching URL-prefix
    # bugs like the one that hid because we talked to postgrest:3001 directly.
    ports:
      - "127.0.0.1:3002:80"
    volumes:
      - ./deploy/db/rest-gateway.Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [postgrest]
    networks: [web]

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: agency-pgadmin
    # Dev-only: `docker compose --profile dev up` brings it up; a bare
    # `docker compose up` (what CD runs) leaves it out.
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local}
      # Same trap as the worker below: a `${VAR:?}` is interpolated even for a
      # service its profile excludes, so this aborted `up` for everyone who
      # never asked for pgAdmin. It refuses to boot on an empty password by
      # itself, which is the right place for that error.
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "127.0.0.1:5050:80"   # loopback only → reach via SSH tunnel, never public
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on: [db]
    networks: [web]

  integrations-worker:
    image: ppc-manager:${IMAGE_TAG:-latest}
    container_name: agency-integrations-worker
    profiles: ["worker"]          # ephemeral: never starts on `up`, only via `run --rm`
    # Named one by one, like every other service: `.env` is the only
    # interpolation source and no container mounts it. The worker is the sole
    # holder of INTEGRATIONS_WORKER_JWT — the role that can read sealed columns.
    environment:
      SUPABASE_URL: http://rest-gateway
      # Soft defaults on purpose: `${VAR:?}` here is evaluated even though the
      # service sits behind a profile, so it would block `up` for the whole
      # stack on a host that never runs the worker. Both are required at run
      # time and the worker says so itself (WorkerError) if they are empty.
      INTEGRATIONS_WORKER_JWT: ${INTEGRATIONS_WORKER_JWT:-}   # JWT, role=integ_worker
      INTEGRATIONS_REDIRECT_URI: ${INTEGRATIONS_REDIRECT_URI:-}  # must match the provider's registered URI
    volumes:
      # The unsealing key is generated on the first run and lives here.
      # The `app` service does NOT mount this volume — that is why it cannot
      # open anything sealed.
      - integrations_keys:/app/data/integrations
    depends_on: [rest-gateway]
    networks: [web]
    mem_limit: 512m

networks:
  web: {}

volumes:
  pgdata: {}
  pgadmin_data: {}
  integrations_keys: {}
